
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eaff, #f5f7ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 45px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 35px #243b6320;
        }

        h1 {
            color: #174ea6;
            font-size: 34px;
        }

        p {
            color: #555;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background: #174ea6;
            color: white;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #103675;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Online Quiz System</h1>
        <p>Welcome! Test your knowledge of Python, HTML,
           Docker and CI/CD.</p>
        <p>Answer the questions and check your score instantly.</p>
        <a href="/quiz">Start Quiz</a>
    </div>
</body>
</html>
