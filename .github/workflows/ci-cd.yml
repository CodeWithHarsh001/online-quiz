
name: Online Quiz CI/CD

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: online-quiz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t online-quiz:${{ github.sha }} .

      - name: Verify Docker Image
        run: docker image inspect online-quiz:${{ github.sha }}

      - name: Pipeline Summary
        run: |
          echo "## Online Quiz CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "- Automated tests passed." >> $GITHUB_STEP_SUMMARY
          echo "- Docker image built successfully." >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
